name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS build (xcodebuild + Metal)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Package.swift pins the engine as a local sibling checkout (../flux-2-swift-mlx-patched):
      # upstream v2.4.0 + the vendored patches (RoPE-cache fix, DOP caption fix). Temporary
      # until upstream ships them. Patches apply in filename order — keep the 000N- prefixes.
      - name: Set up engine fork (upstream v2.4.0 + vendored patches)
        run: |
          git clone --branch v2.4.0 --depth 1 https://github.com/VincentGourbin/flux-2-swift-mlx.git "$GITHUB_WORKSPACE/../flux-2-swift-mlx-patched"
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "Applying $(basename "$p")"
            git -C "$GITHUB_WORKSPACE/../flux-2-swift-mlx-patched" apply "$p"
          done

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Download Metal Toolchain (Xcode 26+)
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::MetalToolchain download returned non-zero (may already be present)"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme Typhoonminigen

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -scheme Typhoonminigen -destination 'platform=macOS' -derivedDataPath .build-ci -skipMacroValidation -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
